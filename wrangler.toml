name = "alertdc-bsky"
main = "src/worker.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Run every 5 minutes. AlertDC posts are usually time-sensitive enough that
# 5-min latency is fine, and it stays well under Workers' free-tier cron limits.
[triggers]
crons = ["*/5 * * * *"]

# KV namespace for bot state. Create with:
#   wrangler kv:namespace create STATE
# then paste the returned id below.
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_ID"

# Non-secret config. Override with `wrangler secret put` for sensitive values.
[vars]
FEED_URL = "https://member.everbridge.net/rest/notif/page?orgId=1332612387832012&pageNo=1&pageSize=25"
MAX_POSTS_PER_RUN = "3"
BOOTSTRAP_SILENT = "true"

# Secrets to set via wrangler:
#   wrangler secret put BSKY_HANDLE
#   wrangler secret put BSKY_APP_PASSWORD
#   wrangler secret put TRIGGER_SECRET   # optional, enables /run?key=...
